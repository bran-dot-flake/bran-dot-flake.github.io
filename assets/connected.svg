<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A phone service becomes a path to root</title><desc id="desc">FreePBX SQL injection enables remote code execution; an incron misconfiguration leads to root.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#fcfaff"/><stop offset="1" stop-color="#edf2f8"/></linearGradient><radialGradient id="wash"><stop stop-color="#d5c1ef" stop-opacity=".45"/><stop offset="1" stop-color="#d5c1ef" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#796b99" stroke-opacity=".065"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#a195b7" stroke-width="1.6"/></marker></defs><rect width="720" height="400" fill="url(#back)"/><ellipse cx="615" cy="115" rx="300" ry="220" fill="url(#wash)"/><rect width="720" height="400" fill="url(#grid)"/><text x="32" y="34" font-family="monospace" font-size="10" fill="#7137b3" letter-spacing="1.6">HACK THE BOX / CONNECTED</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#27213b">A phone service becomes a path to root</text><circle cx="80.0" cy="204" r="49" fill="#7137b3" fill-opacity=".065"/><g transform="translate(46.0 170.0) scale(2.125)" fill="none" stroke="#7137b3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="26" height="20" rx="3"/><path d="M7 4h18M8 12h6v5H8zM19 12h5m-5 5h5M8 22h16"/></g><text x="80.0" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#27213b" font-weight="600">FreePBX</text><text x="80.0" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7b718c" font-weight="600">Exposed service</text><path d="M133.0 204H166.0" fill="none" str