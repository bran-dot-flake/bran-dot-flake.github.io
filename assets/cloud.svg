<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Global signals, one investigation view</title><desc id="desc">An Azure honeypot collects over one hundred thousand security events in twenty-four hours and maps their source locations in Microsoft Sentinel.</desc><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#fcfaff"/><stop offset="1" stop-color="#edf2f8"/></linearGradient><radialGradient id="wash"><stop stop-color="#d5c1ef" stop-opacity=".45"/><stop offset="1" stop-color="#d5c1ef" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#796b99" stroke-opacity=".065"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#a195b7" stroke-width="1.6"/></marker></defs><rect width="720" height="400" fill="url(#back)"/><ellipse cx="615" cy="115" rx="300" ry="220" fill="url(#wash)"/><rect width="720" height="400" fill="url(#grid)"/><text x="32" y="34" font-family="monospace" font-size="10" fill="#7137b3" letter-spacing="1.6">CLOUD TELEMETRY / MICROSOFT SENTINEL</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#27213b">Global signals, one investigation view</text><circle cx="128" cy="215" r="49" fill="#08798c" fill-opacity=".065"/><g transform="translate(81.0 168.0) scale(2.9375)" fill="none" stroke="#08798c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="14"/><ellipse cx="16" cy="16" rx="6" ry="14"/><path d="M2 16h28M5 8h22M5 24h22"/></g><text x="128" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#27213b" font-weight="600">Attack sources</text><circle cx="91" cy="180" r="4" fill="#b32876"/><circle cx="146" cy="191" r="4" fill="#b32876"/><circle cx="118" cy