<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Uncover the payload. Build the detections.</title>
  <desc id="desc">Four code layers: PrintingHouse conceals HWMonitor in bitmap pixels; XOR decoding exposes Noogen.Validation, and child-process memory reveals the credential collector. Recovered code informs three YARA signatures; host telemetry informs four Sigma rules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#94600a" stroke-width="1.6"/></marker>
    <pattern id="pixels" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#e3dcef"/><path d="M0 0h11v11H0zM11 11h11v11H11z" fill="#b69bce"/><path d="M11 0h11v11H11z" fill="#7137b3" opacity=".65"/></pattern>
  </defs>
  <rect width="720" height="400" fill="#eeedf7"/>
  <g font-family="Arial,sans-serif" fill="#29233c">
    <text x="28" y="28" font-family="monospace" font-size="9" font-weight="600" fill="#94600a">MALWARE ANALYSIS / AGENT TESLA</text>
    <text x="28" y="58" font-size="23" font-weight="700">Uncover the payload. Build the detections.</text>
    <rect x="28" y="84" width="664" height="181" rx="9" fill="#fcfbff" stroke="#c9c5db"/>
    <text x="44" y="103" font-family="monospace" font-size="8" fill="#716a84">RECOVERED .NET LOADING CHAIN / FOUR INSPECTED LAYERS</text>

    <!-- A bitmap cutaway makes the concealed-code idea visible at a glance. -->
    <g transform="translate(50 119)">
      <path d="M8 0h65l19 19v79H8z" fill="#f4f0f9" stroke="#b69bce" stroke-width="1.5"/>
      <path d="M73 0v19h19" fill="none" stroke="#b69bce" stroke-width="1.5"/>
      <rect x="19" y="29" width="62" height="50" rx="3" fill="url(#pixels)"/>
      <rect x="42" y="46" width="44" height="24" rx="4" fill="#7137b3"/>
      <text x="64" y="63" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#fff">MZ</text>
      <text x="50" y="115" text-anchor="middle" font-size="11" font-weight="700">PrintingHouse</text>
      <text x="50" y="131" text-anchor="middle" font-size="9" fill="#716a84">Bitmap-hidden code</text>
    </g>
    <g fill="none" stroke="#94600a" stroke-width="1.6" marker-end="url(#arrow)"><path d="M150 169h45"/><path d="M310 169h47"/><path d="M474 169h47"/></g>
    <g font-family="monospace" font-size="7.5" fill="#94600a" text-anchor="middle"><text x="174" y="151">PIXELS</text><text x="334" y="151">XOR</text><text x="498" y="151">MEMORY</text></g>

    <g transform="translate(204 123)">
      <rect width="104" height="94" rx="6" fill="#f4f0f9" stroke="#b69bce"/>
      <path d="m34 29-12 12 12 12m36-24 12 12-12 12M57 25 47 57" fill="none" stroke="#7137b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="77" text-anchor="middle" font-family="monospace" font-size="9" fill="#7137b3">Assembly.Load</text>
      <text x="52" y="111" text-anchor="middle" font-size="11" font-weight="700">HWMonitor</text>
      <text x="52" y="127" text-anchor="middle" font-size="9" fill="#716a84">Extract + decode</text>
    </g>
    <g transform="translate(366 123)">
      <rect width="104" height="94" rx="6" fill="#f4f0f9" stroke="#b69bce"/>
      <g fill="none" stroke="#7137b3" stroke-width="1.6"><rect x="40" y="13" width="24" height="18" rx="3"/><path d="M52 31v13M23 57V44h58v13"/><rect x="12" y="57" width="23" height="18" rx="3"/><rect x="69" y="57" width="23" height="18" rx="3"/></g>
      <text x="52" y="111" text-anchor="middle" font-size="11" font-weight="700">Noogen.Validation</text>
      <text x="52" y="127" text-anchor="middle" font-size="9" fill="#716a84">Resolve hidden calls</text>
    </g>
    <g transform="translate(530 119)">
      <rect width="140" height="103" rx="6" fill="#fbf5e9" stroke="#c9a568"/>
      <rect x="10" y="12" width="120" height="79" rx="4" fill="#fcfbff" stroke="#d4bc95"/>
      <path d="M10 30h120" stroke="#d4bc95"/><circle cx="20" cy="21" r="2" fill="#94600a"/>
      <text x="30" y="24" font-family="monospace" font-size="8" fill="#94600a">CHILD PROCESS</text>
      <g fill="none" stroke="#94600a" stroke-width="1.8" stroke-linecap="round"><circle cx="43" cy="53" r="7"/><path d="m48 58 13 13m-6-6 4-4m-9-1 4-4"/><path d="M78 46h38M78 55h30M78 64h34M78 73h21"/></g>
      <text x="70" y="115" text-anchor="middle" font-size="11" font-weight="700">Credential collector</text>
      <text x="70" y="131" text-anchor="middle" font-size="9" fill="#716a84">Rebuilt from memory</text>
    </g>

    <path d="M360 265v14h157v16" fill="none" stroke="#94600a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M360 279H203v16" fill="none" stroke="#94600a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g transform="translate(44 299)">
      <rect width="318" height="56" rx="6" fill="#fcfbff" stroke="#c9c5db"/>
      <path d="M17 13h18l8 8v22H17zM35 13v8h8" fill="#f4f0f9" stroke="#7137b3" stroke-width="1.3"/>
      <path d="m23 33 4 4 9-10" fill="none" stroke="#7137b3" stroke-width="2"/>
      <text x="56" y="24" font-size="14" font-weight="700" fill="#7137b3">3 YARA signatures</text>
      <text x="56" y="41" font-size="10" fill="#716a84">Loader + recovered payload</text>
    </g>
    <g transform="translate(378 299)">
      <rect width="298" height="56" rx="6" fill="#fcfbff" stroke="#c9c5db"/>
      <path d="m29 12 14 6v10c0 9-14 17-14 17S15 37 15 28V18z" fill="#fbf5e9" stroke="#94600a" stroke-width="1.3"/>
      <path d="m22 27 5 5 9-10" fill="none" stroke="#94600a" stroke-width="2"/>
      <text x="56" y="24" font-size="14" font-weight="700" fill="#94600a">4 Sigma rules</text>
      <text x="56" y="41" font-size="10" fill="#716a84">Process creation · DNS · FTP</text>
    </g>
    <path d="M28 379h28" stroke="#94600a" stroke-width="2"/>
    <text x="67" y="382" font-family="monospace" font-size="8" fill="#716a84">STATIC + DYNAMIC + MEMORY EVIDENCE → DETECTION ENGINEERING</text>
  </g>
</svg>
