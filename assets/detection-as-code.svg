<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">From a rule change to a live detection.</title>
  <desc id="desc">Versioned Sigma rules pass fixture tests and compile to SPL in GitHub Actions. Trusted changes are verified against isolated test data in live Splunk before snapshot-backed deployment. Drift monitoring and manual rollback complete the detection lifecycle. The project documents nine rules, thirteen event corpora, and 117 explicit rule/corpus expectations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#315aa8" stroke-width="1.6"/></marker>
  </defs>
  <rect width="720" height="400" fill="#eeedf7"/>
  <g font-family="Arial,sans-serif" fill="#29233c">
    <text x="28" y="28" font-family="monospace" font-size="9" font-weight="600" fill="#315aa8">DETECTION ENGINEERING / CI/CD</text>
    <text x="28" y="58" font-size="23" font-weight="700">From a rule change to a live detection.</text>

    <!-- Git source: a branch and a concrete, versioned Sigma document. -->
    <rect x="28" y="92" width="174" height="178" rx="8" fill="#fcfbff" stroke="#c9c5db"/>
    <image x="42" y="104" width="17" height="17" xlink:href="data:image/svg+xml;base64,"/>
    <text x="67" y="116" font-family="monospace" font-size="9" fill="#716a84">GIT / SIGMA</text>
    <g fill="none" stroke="#315aa8" stroke-width="2" stroke-linecap="round">
      <path d="M56 146v77m0-40c0-20 27-7 27-29"/>
      <circle cx="56" cy="148" r="5" fill="#fcfbff"/><circle cx="56" cy="220" r="5" fill="#fcfbff"/><circle cx="83" cy="151" r="5" fill="#fcfbff"/>
    </g>
    <path d="M106 141h53l15 15v70h-68z" fill="#edf2fb" stroke="#9bafd3" stroke-width="1.3"/>
    <path d="M159 141v15h15" fill="none" stroke="#9bafd3"/>
    <text x="140" y="188" text-anchor="middle" font-size="31" font-weight="700" fill="#315aa8">Σ</text>
    <path d="M120 201h39m-39 8h27" stroke="#9bafd3" stroke-width="2" stroke-linecap="round"/>
    <text x="115" y="248" text-anchor="middle" font-size="12" font-weight="700">9 versioned detections</text>

    <path d="M210 180h37" fill="none" stroke="#315aa8" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- CI: a visual test matrix feeds the compiled Splunk search artifact. -->
    <rect x="258" y="92" width="180" height="178" rx="8" fill="#fcfbff" stroke="#c9c5db"/>
    <circle cx="279" cy="112" r="8" fill="#edf2fb" stroke="#9bafd3"/>
    <path d="m277 108 6 4-6 4z" fill="#315aa8"/>
    <text x="295" y="116" font-family="monospace" font-size="8.5" fill="#716a84">GITHUB ACTIONS</text>
    <g fill="#e4f2e8" stroke="#a4c6af"><rect x="275" y="145" width="20" height="20" rx="3"/><rect x="300" y="145" width="20" height="20" rx="3"/><rect x="325" y="145" width="20" height="20" rx="3"/><rect x="275" y="170" width="20" height="20" rx="3"/><rect x="300" y="170" width="20" height="20" rx="3"/><rect x="325" y="170" width="20" height="20" rx="3"/><rect x="275" y="195" width="20" height="20" rx="3"/><rect x="300" y="195" width="20" height="20" rx="3"/><rect x="325" y="195" width="20" height="20" rx="3"/></g>
    <g fill="none" stroke="#227340" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m281 155 3 3 5-6m17 3 3 3 5-6m17 3 3 3 5-6m-59 28 3 3 5-6m17 3 3 3 5-6m17 3 3 3 5-6m-59 28 3 3 5-6m17 3 3 3 5-6m17 3 3 3 5-6"/></g>
    <path d="M351 180h18" fill="none" stroke="#315aa8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="378" y="150" width="43" height="63" rx="4" fill="#edf2fb" stroke="#9bafd3"/>
    <text x="399.5" y="178" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#315aa8">SPL</text>
    <path d="M388 188h23m-23 7h16" stroke="#9bafd3" stroke-width="1.5" stroke-linecap="round"/>
    <text x="348" y="241" text-anchor="middle" font-size="12" font-weight="700">Test + compile</text>
    <text x="348" y="258" text-anchor="middle" font-size="9" fill="#716a84">13 corpora · 117 expectations</text>

    <!-- Protected promotion precedes access to the private Splunk lab. -->
    <path d="M446 180h38" fill="none" stroke="#315aa8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <g fill="none" stroke="#315aa8" stroke-width="1.4"><rect x="458" y="144" width="17" height="14" rx="3" fill="#edf2fb"/><path d="M462 144v-5a4.5 4.5 0 0 1 9 0v5"/></g>
    <text x="466" y="203" text-anchor="middle" font-family="monospace" font-size="7" fill="#315aa8">MAIN</text>

    <!-- Destination: a recognizable Splunk search view with a live test gate. -->
    <rect x="496" y="92" width="196" height="178" rx="8" fill="#fcfbff" stroke="#c9c5db"/>
    <image x="510" y="104" width="20" height="17" xlink:href="data:image/png;base64,"/>
    <text x="538" y="116" font-family="monospace" font-size="9" fill="#716a84">SPLUNK ENTERPRISE</text>
    <rect x="510" y="133" width="168" height="88" rx="5" fill="#f4f3f9" stroke="#c9c5db"/>
    <rect x="518" y="142" width="130" height="17" rx="3" fill="#fcfbff" stroke="#c9c5db"/>
    <text x="524" y="153" font-family="monospace" font-size="7.5" fill="#716a84">index=sysmon ...</text>
    <rect x="653" y="142" width="17" height="17" rx="3" fill="#315aa8"/>
    <path d="m659 146 6 4-6 4" fill="none" stroke="#fff" stroke-width="1.4"/>
    <g fill="#a8bbdf"><rect x="520" y="192" width="9" height="18" rx="1"/><rect x="533" y="183" width="9" height="27" rx="1"/><rect x="546" y="188" width="9" height="22" rx="1"/><rect x="559" y="172" width="9" height="38" rx="1"/><rect x="572" y="179" width="9" height="31" rx="1"/><rect x="585" y="190" width="9" height="20" rx="1"/></g>
    <circle cx="635" cy="188" r="16" fill="#e4f2e8" stroke="#a4c6af"/>
    <path d="m628 188 5 5 9-11" fill="none" stroke="#227340" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="594" y="241" text-anchor="middle" font-size="12" font-weight="700">Verify + deploy</text>
    <text x="594" y="258" text-anchor="middle" font-size="9" fill="#716a84">Live test → snapshot → saved searches</text>

    <!-- A feedback arc keeps health and recovery part of the main story. -->
    <path d="M594 277v22q0 31-31 31H146q-31 0-31-31v-21" fill="none" stroke="#315aa8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <g transform="translate(194 302)">
      <rect width="158" height="55" rx="7" fill="#fcfbff" stroke="#9bafd3"/>
      <path d="M12 28h6l4-10 6 21 5-13h10" fill="none" stroke="#315aa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="24" font-size="11" font-weight="700">Monitor drift</text>
      <text x="52" y="41" font-size="9" fill="#716a84">Git ↔ live searches</text>
    </g>
    <g transform="translate(368 302)">
      <rect width="158" height="55" rx="7" fill="#fcfbff" stroke="#9bafd3"/>
      <path d="M16 20a12 12 0 1 1-1 17m1-17v9h9" fill="none" stroke="#315aa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="24" font-size="11" font-weight="700">Rollback</text>
      <text x="52" y="41" font-size="9" fill="#716a84">Verified snapshots</text>
    </g>
    <path d="M28 379h28" stroke="#315aa8" stroke-width="2"/>
    <text x="67" y="382" font-family="monospace" font-size="8" fill="#716a84">VERSION → TEST → VERIFY → DEPLOY → MONITOR + RECOVER</text>
  </g>
</svg>
