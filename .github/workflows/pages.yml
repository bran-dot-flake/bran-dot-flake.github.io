name: Refresh stats and publish portfolio

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh public profile stats
        run: python3 scripts/refresh_stats.py
      - name: Refresh public GitHub contributions
        run: python3 scripts/refresh_contributions.py
      - name: Save the latest successful counts and calendar
        run: |
          if git diff --quiet -- stats.js contributions.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.js contributions.js
          git commit -m 'Refresh public training stats and GitHub calendar'
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp *.html style.css script.js content.js stats.js graphs.js contributions.js CNAME _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
